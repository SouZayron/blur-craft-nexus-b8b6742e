<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labxat - Experimente, Crie & Jogue!</title>
    <link rel="icon" href="/labxat-logo-64.png" type="image/png" sizes="64x64" />
    <meta name="description" content="Labxat é um laboratório criativo digital. Explore ferramentas únicas como gerador de nicks personalizados, gerador de cores e bingo interativo." />
    <meta name="author" content="Labxat" />
    <meta name="keywords" content="Labxat, ferramentas criativas, gerador de nicks, gerador de cores, bingo online" />
    
    <!-- Security & Trust Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Additional Trust Signals -->
    <link rel="canonical" href="https://labxat.com/" />
    <meta property="og:site_name" content="Labxat" />
    <meta property="og:locale" content="pt_BR" />

    <meta property="og:title" content="Labxat - Experimente, Crie & Jogue!" />
    <meta property="og:description" content="Experimente, Crie & Jogue! Descubra ferramentas criativas únicas." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Labxat - Experimente, Crie & Jogue!" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load font non-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>

    <!-- Preload local LCP logo (served from same origin, instant) -->
    <link rel="preload" as="image" href="/labxat-logo-64.webp" type="image/webp" fetchpriority="high" />

    <!-- DNS prefetch for non-critical external resources -->
    <link rel="dns-prefetch" href="https://xat.com" />
    <link rel="dns-prefetch" href="https://xatimg.com" />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />

    <!-- AdSense: load on first user interaction (scroll, click, keydown, touch)
         OR after a generous timeout fallback. Removes ~263KB and ~150ms of
         long tasks from the critical path while still serving ads. -->
    <script>
      (function () {
        var loaded = false;
        var events = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
        function loadAds() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) {
            window.removeEventListener(e, loadAds, true);
          });
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9503578701144532';
          document.head.appendChild(s);
        }
        events.forEach(function (e) {
          window.addEventListener(e, loadAds, { passive: true, capture: true, once: true });
        });
        // Fallback so passive viewers still see ads
        setTimeout(loadAds, 8000);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
