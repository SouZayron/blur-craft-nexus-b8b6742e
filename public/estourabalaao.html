<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Estoura Balão · Rádio Alta Vibe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0B1E;--bg2:#16122e;--violet:#7C3AED;--pink:#EC4899;--cyan:#06B6D4;
  --yellow:#F59E0B;--green:#10B981;--red:#EF4444;--text:#fff;--muted:#a8a4c7;
  --glass:rgba(255,255,255,.05);--border:rgba(255,255,255,.12);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden}
body{
  background:
    radial-gradient(ellipse 60% 40% at 10% 10%,rgba(124,58,237,.25),transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 90%,rgba(236,72,153,.22),transparent 60%),
    linear-gradient(135deg,#0D0B1E,#1a1140);
}
h1,h2,h3,.font-display{font-family:'Orbitron',sans-serif;letter-spacing:.5px}
.app{display:grid;grid-template-columns:320px 1fr 320px;height:100vh;gap:10px;padding:10px}
@media(max-width:1100px){.app{grid-template-columns:280px 1fr 280px}}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:auto;min-height:100vh;overflow:auto}html,body{overflow:auto}.sidebar{overflow:visible !important}}
.sidebar{display:flex;flex-direction:column;gap:10px;overflow:hidden;min-height:0}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card h2{font-size:12px;text-transform:uppercase;margin-bottom:9px;color:#fff;display:flex;align-items:center;gap:6px;letter-spacing:.8px}
.card.scroll{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.card.scroll .scroll-body{flex:1;min-height:0;overflow-y:auto}
.card.scroll .scroll-body::-webkit-scrollbar{width:4px}
.card.scroll .scroll-body::-webkit-scrollbar-thumb{background:var(--violet);border-radius:3px}
.input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:#fff;font-size:14px;font-family:inherit;margin-bottom:9px;transition:.2s}
.input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.25)}
.btn{width:100%;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border:none;padding:12px;border-radius:12px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:1px;box-shadow:0 0 12px rgba(124,58,237,.6),0 0 24px rgba(124,58,237,.3);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 18px var(--violet),0 0 32px rgba(236,72,153,.5)}
.btn.red{background:linear-gradient(135deg,#dc2626,var(--red));box-shadow:0 0 12px rgba(239,68,68,.6)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.5);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.pink{background:rgba(236,72,153,.18);border-color:rgba(236,72,153,.5)}
.badge.yellow{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5)}
.player-info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{padding:7px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
table th{font-family:'Orbitron',sans-serif;font-size:11px;text-transform:uppercase;color:var(--muted)}
table tr:last-child td{border:0}
ul.rules{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12px;color:#e5e1ff}
ul.rules li{padding-left:14px;position:relative;line-height:1.35}
ul.rules li:before{content:"▸";position:absolute;left:0;color:var(--pink)}
ul.rules li.kill:before{content:"⛔";color:var(--red)}
.streak-box{display:flex;flex-direction:column;gap:6px;font-size:12px}
.streak-box .row{display:flex;align-items:center;gap:8px;padding:6px 9px;background:rgba(255,255,255,.04);border-radius:8px;border:1px solid var(--border)}
.streak-counter{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;text-align:center;background:linear-gradient(135deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(236,72,153,.5);margin-top:3px}
.log{display:flex;flex-direction:column;gap:5px}
.log::-webkit-scrollbar{width:5px}.log::-webkit-scrollbar-thumb{background:var(--violet);border-radius:3px}
.log-entry{display:flex;align-items:center;gap:8px;padding:5px 7px;background:rgba(255,255,255,.03);border-radius:8px;font-size:11px}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;font-family:'Orbitron'}
.log-meta{flex:1;display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden}
.log-name{font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.log-time{color:var(--muted);font-size:9px}
.log-vc{font-family:'Orbitron';font-weight:700;color:var(--yellow);font-size:12px;text-shadow:0 0 8px rgba(245,158,11,.6)}
.rank-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.03);font-size:12px}
.rank-row.me{background:rgba(236,72,153,.15);border:1px solid rgba(236,72,153,.4)}
.rank-pos{font-family:'Orbitron';font-weight:900;font-size:13px;width:22px;text-align:center}
.rank-pos.p1{color:#FFD700;text-shadow:0 0 8px #FFD700}
.rank-pos.p2{color:#C0C0C0;text-shadow:0 0 6px #C0C0C0}
.rank-pos.p3{color:#CD7F32;text-shadow:0 0 6px #CD7F32}
.rank-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-vc{font-family:'Orbitron';font-weight:700;color:var(--yellow);font-size:12px}
.rank-prize{font-size:10px;color:var(--muted);margin-left:4px}
.weights{display:flex;flex-direction:column;gap:4px;font-size:11px}
.weights .w-row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:rgba(255,255,255,.03);border-radius:7px;border:1px solid rgba(255,255,255,.05)}

.weights .w-label{font-weight:600;color:#fff}
.weights .w-pct{font-family:'Orbitron';font-weight:700;color:var(--cyan);font-size:11px}
.bonus-list{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#e5e1ff}
.bonus-list li{padding:5px 8px;background:rgba(255,255,255,.03);border-radius:7px;list-style:none;line-height:1.4}
.bonus-list b{color:var(--pink)}
/* RIGHT PANEL */
.game{position:relative;border-radius:18px;border:1px solid var(--border);background:radial-gradient(ellipse at center,rgba(124,58,237,.08),transparent 70%),rgba(13,11,30,.6);overflow:hidden;min-height:520px}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.7;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.9;transform:scale(1.2)}}
.game-top{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;z-index:5;background:linear-gradient(180deg,rgba(13,11,30,.85),transparent)}
.game-top .stat{display:flex;align-items:center;gap:6px;font-size:13px}
.game-top .stat strong{font-family:'Orbitron';color:var(--yellow);text-shadow:0 0 8px rgba(245,158,11,.6)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px}
.empty .big-balloon{font-size:90px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--pink))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.empty p{font-family:'Orbitron';font-size:18px;color:#fff}
.balloons{position:absolute;inset:0;overflow:hidden}
.balloon{position:absolute;bottom:-120px;width:60px;height:75px;border-radius:50% 50% 48% 48%;cursor:pointer;animation:rise linear forwards;transform-origin:center bottom;will-change:transform;filter:drop-shadow(0 0 12px currentColor)}
.balloon:after{content:"";position:absolute;left:50%;bottom:-22px;width:1.5px;height:22px;background:rgba(255,255,255,.4);transform:translateX(-50%)}
.balloon:before{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;background:inherit;border-radius:50% 50% 0 0;transform:translateX(-50%) rotate(180deg);clip-path:polygon(0 100%,50% 0,100% 100%)}
@keyframes rise{
  0%{transform:translateY(0) translateX(0)}
  25%{transform:translateY(-30vh) translateX(20px)}
  50%{transform:translateY(-55vh) translateX(-25px)}
  75%{transform:translateY(-80vh) translateX(15px)}
  100%{transform:translateY(-115vh) translateX(0)}
}
.hint{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.5);padding:6px 14px;border-radius:999px;font-size:12px;font-family:'Orbitron';letter-spacing:1px;animation:floatHint 2.5s ease-in-out infinite;z-index:4}
@keyframes floatHint{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.pop-particle{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:burst .7s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.float-vc{position:absolute;pointer-events:none;font-family:'Orbitron';font-weight:900;font-size:24px;color:var(--yellow);text-shadow:0 0 12px var(--yellow);animation:floatup 1.6s ease-out forwards;z-index:10}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-100px);opacity:0}}
.daily-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.daily-done h2{font-size:22px}
.countdown{font-family:'Orbitron';font-size:32px;font-weight:900;color:var(--pink);text-shadow:0 0 16px var(--pink)}
.summary{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:14px 26px;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.5);border-radius:14px}
.summary span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.summary strong{font-family:'Orbitron';font-size:28px;color:var(--yellow);text-shadow:0 0 14px rgba(245,158,11,.6)}
.legendary{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--yellow),var(--pink));padding:8px 16px;border-radius:999px;font-family:'Orbitron';font-weight:700;font-size:12px;animation:pulse 1.5s infinite;z-index:6}
@keyframes pulse{0%,100%{box-shadow:0 0 12px var(--yellow)}50%{box-shadow:0 0 28px var(--pink),0 0 40px var(--yellow)}}
/* ADMIN */
.admin{padding:24px;max-width:1200px;margin:0 auto;overflow:auto;height:100vh}
.admin h1{font-size:28px;margin-bottom:18px;background:linear-gradient(135deg,var(--red),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.admin .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:16px;backdrop-filter:blur(14px)}
.stat-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat-card .value{font-family:'Orbitron';font-size:26px;font-weight:900;color:var(--yellow);margin-top:6px;text-shadow:0 0 10px rgba(245,158,11,.5)}
.admin .row-btns{display:flex;gap:6px;flex-wrap:wrap}
.admin .row-btns button{padding:6px 10px;font-size:11px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-family:'Inter';font-weight:600}
.admin .row-btns button.danger{border-color:var(--red);color:var(--red)}
.admin .row-btns button:hover{background:rgba(255,255,255,.12)}
.admin section{margin-bottom:22px}
.admin section h2{font-family:'Orbitron';font-size:16px;margin-bottom:10px;color:var(--pink);text-transform:uppercase;letter-spacing:1px}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input,.toolbar button{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:#fff;font-family:'Inter';font-size:13px}
.toolbar button{background:linear-gradient(135deg,var(--violet),var(--pink));border:0;cursor:pointer;font-weight:700}
.login-admin{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:20px}
.login-admin .card{width:100%;max-width:380px}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============ STATE ============ */
const LS_PLAYERS='estourabalaao_players';
const LS_LOG='estourabalaao_global_log';
const LS_RESET='estourabalaao_reset_version';
const RESET_VERSION='2026-06-16-v1';
// Start: 16/06/2026 00:00 Brasília (UTC-3) → 03:00 UTC
const START_AT_MS=Date.UTC(2026,5,16,3,0,0);
const COOLDOWN_MS=24*60*60*1000;
const COLORS=['#EC4899','#7C3AED','#06B6D4','#F59E0B','#10B981'];
const WEIGHTS=[[5,40],[10,20],[20,10],[30,5],[40,3],[50,1]];
let session={user:null};
let balloonTimer=null;

// One-time reset of legacy data
try{
  if(localStorage.getItem(LS_RESET)!==RESET_VERSION){
    localStorage.removeItem(LS_PLAYERS);
    localStorage.removeItem(LS_LOG);
    localStorage.setItem(LS_RESET,RESET_VERSION);
  }
}catch(e){}

function loadPlayers(){try{return JSON.parse(localStorage.getItem(LS_PLAYERS))||{}}catch(e){return{}}}
function savePlayers(p){localStorage.setItem(LS_PLAYERS,JSON.stringify(p))}
function loadLog(){try{return JSON.parse(localStorage.getItem(LS_LOG))||[]}catch(e){return[]}}
function saveLog(l){localStorage.setItem(LS_LOG,JSON.stringify(l.slice(0,500)))}
function hashPw(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return 'h'+h}
function todayStr(){const d=new Date();const o=new Date(d.getTime()-d.getTimezoneOffset()*60000-3*3600000);return o.toISOString().slice(0,10)}
function nowTime(){const d=new Date();return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function diffDays(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function gameStarted(){return Date.now()>=START_AT_MS}
function fmtHMS(ms){let s=Math.max(0,Math.floor(ms/1000));const h=String(Math.floor(s/3600)).padStart(2,'0');s%=3600;const m=String(Math.floor(s/60)).padStart(2,'0');const ss=String(s%60).padStart(2,'0');return `${h}:${m}:${ss}`}
function fmtDHMS(ms){let s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400);s%=86400;const h=String(Math.floor(s/3600)).padStart(2,'0');s%=3600;const m=String(Math.floor(s/60)).padStart(2,'0');const ss=String(s%60).padStart(2,'0');return d>0?`${d}d ${h}:${m}:${ss}`:`${h}:${m}:${ss}`}

function weightedRoll(){
  const total=WEIGHTS.reduce((s,w)=>s+w[1],0);
  let r=Math.random()*total;
  for(const[v,w]of WEIGHTS){r-=w;if(r<=0)return{value:v};}
  return{value:5};
}


function popSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='triangle';o.frequency.setValueAtTime(800,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(120,ctx.currentTime+.15);
    g.gain.setValueAtTime(.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2);
    o.start();o.stop(ctx.currentTime+.2);
  }catch(e){}
}

/* ============ ROUTER ============ */
const isAdmin=window.location.pathname.toLowerCase().includes('adminbalao')||new URLSearchParams(window.location.search).get('admin')==='1';
const root=document.getElementById('root');

if(isAdmin)renderAdminGate();else renderGame();

/* ============ MAIN GAME ============ */
function renderGame(){
  root.innerHTML=`
  <div class="app">
    <aside class="sidebar">
      <div class="card" id="loginCard">
        <h2>🎈 Estoura Balão</h2>
        <div id="loginArea"></div>
      </div>
      <div class="card">
        <h2>📋 Regras</h2>
        <ul class="rules">
          <li>Início: <b>16/06/2026</b> · (horário de Brasília)</li>
          <li>Use o <b>mesmo nome e senha</b> todos os dias para acumular</li>
          <li><b>1 estouro a cada 24h</b> · VibeCoins aleatórios</li>
          <li>🏆 Prêmios: <b>1º 1500x</b> · <b>2º 1000x</b> · <b>3º 500x</b></li>
          <li>Cadastros duplicados: vale o de <b>maior valor acumulado</b></li>
          <li>É necessário ser <b>ativo no xat.com/altavibe</b></li>
          <li class="kill"><b>Fraudar o jogo!</b> (Eliminatória)</li>
        </ul>
      </div>
      <div class="card">
        <h2>⚖️ Peso dos Ganhos</h2>
        <div class="weights">
          <div class="w-row"><span class="w-label">50 VC</span><span class="w-pct">1%</span></div>
          <div class="w-row"><span class="w-label">40 VC</span><span class="w-pct">3%</span></div>
          <div class="w-row"><span class="w-label">30 VC</span><span class="w-pct">5%</span></div>
          <div class="w-row"><span class="w-label">20 VC</span><span class="w-pct">10%</span></div>
          <div class="w-row"><span class="w-label">10 VC</span><span class="w-pct">20%</span></div>
          <div class="w-row"><span class="w-label">5 VC</span><span class="w-pct">40%</span></div>
        </div>
      </div>
    </aside>
    <main class="game" id="gameArea">
      <div class="stars" id="stars"></div>
    </main>
    <aside class="sidebar">
      <div class="card scroll" style="flex:2;min-height:0">
        <h2>🏆 Ranking · Top 30</h2>
        <div class="scroll-body"><div id="rankList" style="display:flex;flex-direction:column;gap:5px"></div></div>
      </div>
      <div class="card scroll" style="flex:1;min-height:120px;max-height:38%">
        <h2>📜 LOGS · Total do dia</h2>
        <div class="scroll-body"><div class="log" id="logList"></div></div>
      </div>
    </aside>
  </div>`;
  buildStars();
  renderLoginArea();
  renderRanking();
  renderLog();
  renderGameArea();
}

function renderRanking(){
  const el=document.getElementById('rankList');if(!el)return;
  const players=loadPlayers();
  const names=Object.keys(players).sort((a,b)=>players[b].total_vc-players[a].total_vc).slice(0,30);
  if(!names.length){el.innerHTML='<p style="color:var(--muted);font-size:11px;text-align:center;padding:10px">Sem jogadores ainda</p>';return}
  const PRIZE=['1500x','1000x','500x'];
  el.innerHTML=names.map((n,i)=>{
    const cls=i<3?` p${i+1}`:'';
    const me=session.user===n?' me':'';
    const prize=PRIZE[i]?`<span class="rank-prize">${PRIZE[i]}</span>`:'';
    return `<div class="rank-row${me}"><div class="rank-pos${cls}">${i+1}º</div><div class="rank-name">${n}</div><div class="rank-vc">${players[n].total_vc}</div>${prize}</div>`;
  }).join('');
}

function buildStars(){
  const s=document.getElementById('stars');if(!s)return;
  let h='';for(let i=0;i<40;i++){
    const x=Math.random()*100,y=Math.random()*100,sz=Math.random()*2+1,d=Math.random()*3;
    h+=`<div class="star" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;animation-delay:${d}s"></div>`;
  }s.innerHTML=h;
}

function renderLoginArea(){
  const a=document.getElementById('loginArea');
  if(!session.user){
    a.innerHTML=`
      <input class="input" id="iName" placeholder="Nome do Jogador" maxlength="20"/>
      <input class="input" id="iPass" type="password" placeholder="Senha" maxlength="20"/>
      <button class="btn" id="btnLogin">ENTRAR</button>
      <p style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center">Jogador novo? Será registrado automaticamente.</p>`;
    document.getElementById('btnLogin').onclick=doLogin;
    document.getElementById('iPass').onkeydown=e=>{if(e.key==='Enter')doLogin()};
  }else{
    const p=loadPlayers()[session.user];
    a.innerHTML=`
      <div class="player-info">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="avatar">${session.user[0].toUpperCase()}</div>
          <strong>${session.user}</strong>
        </div>
        <span class="badge yellow">⭐ ${p.total_vc} VC</span>
      </div>
      <button class="btn ghost" id="btnLogout" style="margin-top:6px">SAIR</button>`;
    document.getElementById('btnLogout').onclick=()=>{session.user=null;renderLoginArea();renderGameArea();renderRanking()};
  }
  renderStreak();
}

function doLogin(){
  const name=document.getElementById('iName').value.trim();
  const pass=document.getElementById('iPass').value.trim();
  if(!name||!pass){alert('Preencha nome e senha');return}
  const players=loadPlayers();
  if(players[name]){
    if(players[name].password!==hashPw(pass)){alert('Senha incorreta');return}
  }else{
    players[name]={password:hashPw(pass),total_vc:0,streak:0,last_play_date:null,next_play_at:0,pops_today:0,today_values:[],history:[]};
    savePlayers(players);
  }
  session.user=name;
  updateStreakOnLogin();
  renderLoginArea();renderGameArea();renderRanking();
}

function updateStreakOnLogin(){
  const players=loadPlayers();const p=players[session.user];const t=todayStr();
  if(!p.last_play_date){/*no change yet*/}
  else{
    const d=diffDays(p.last_play_date,t);
    if(d>1)p.streak=0;
    if(d>=1){p.pops_today=0;p.today_values=[]}
  }
  savePlayers(players);
}

function renderStreak(){
  const el=document.getElementById('streakCounter');if(!el)return;
  if(!session.user){el.innerHTML='';return}
  const p=loadPlayers()[session.user];
  el.innerHTML=`<div class="streak-counter">🔥 ${p.streak||0} dias</div>`;
}

function renderLog(){
  const el=document.getElementById('logList');if(!el)return;
  const log=loadLog();
  // aggregate by player+date → total VC per user per day
  const agg={};
  for(const e of log){
    const k=e.player+'|'+e.date;
    if(!agg[k])agg[k]={player:e.player,date:e.date,vc:0,time:e.time};
    agg[k].vc+=e.vc;
  }
  const rows=Object.values(agg).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,30);
  if(!rows.length){el.innerHTML='<p style="color:var(--muted);font-size:12px;text-align:center;padding:14px">Nenhum estouro ainda</p>';return}
  el.innerHTML=rows.map(e=>`
    <div class="log-entry">
      <div class="avatar">${e.player[0].toUpperCase()}</div>
      <div class="log-meta"><span class="log-name">${e.player}</span><span class="log-time">${e.date}</span></div>
      <span class="log-vc">+${e.vc}</span>
    </div>`).join('');
}

function clearBalloonTimer(){if(balloonTimer){clearInterval(balloonTimer);balloonTimer=null}}

function renderGameArea(){
  clearBalloonTimer();
  const g=document.getElementById('gameArea');
  g.querySelectorAll('.game-top,.empty,.balloons,.daily-done,.legendary').forEach(n=>n.remove());
  // Pre-start screen
  if(!gameStarted()){
    const d=document.createElement('div');d.className='daily-done';
    d.innerHTML=`<div class="big-balloon" style="font-size:80px">🎈</div>
      <h2 class="font-display">O jogo começa em</h2>
      <div class="countdown" id="cd">--d --:--:--</div>
      <p style="color:var(--muted);font-size:13px">16/06/2026 · 00:00 (horário de Brasília)</p>`;
    g.appendChild(d);
    startCountdownTo(START_AT_MS,true);
    return;
  }
  if(!session.user){
    const d=document.createElement('div');d.className='empty';
    d.innerHTML=`<div class="big-balloon">🎈</div><p>Entre com seu nome e senha para jogar</p>`;
    g.appendChild(d);return;
  }
  const players=loadPlayers();const p=players[session.user];
  const nextAt=p.next_play_at||0;
  const onCooldown=Date.now()<nextAt;
  const top=document.createElement('div');top.className='game-top';
  top.innerHTML=`
    <div class="stat">👤 <strong>${session.user}</strong></div>
    <div class="stat">⭐ <strong>${p.total_vc} VC</strong></div>
    <div class="stat">🔥 Streak: <strong>${p.streak||0}</strong></div>
    <div class="stat">⏱️ Próximo: <strong id="nextIn">${onCooldown?fmtHMS(nextAt-Date.now()):'PRONTO'}</strong></div>`;
  g.appendChild(top);
  if(p.streak>=7){
    const b=document.createElement('div');b.className='legendary';b.textContent='🏆 STREAK LENDÁRIO';g.appendChild(b);
  }
  if(onCooldown){
    const dd=document.createElement('div');dd.className='daily-done';
    dd.innerHTML=`<h2 class="font-display">🎈 Volte em breve!</h2>
      <p style="color:var(--muted)">Você poderá estourar novamente em:</p>
      <div class="countdown" id="cd">--:--:--</div>
      <div class="summary"><span>Saldo total</span><strong>${p.total_vc} VC</strong></div>`;
    g.appendChild(dd);startCountdownTo(nextAt,false);
    return;
  }
  const ba=document.createElement('div');ba.className='balloons';ba.id='balloons';g.appendChild(ba);
  const hint=document.createElement('div');hint.className='hint';hint.textContent='👆 CLIQUE NO BALÃO';g.appendChild(hint);
  setTimeout(()=>{hint.style.transition='opacity .6s';hint.style.opacity='0';setTimeout(()=>hint.remove(),700)},5000);
  spawnBalloon(-3);spawnBalloon(-1);spawnBalloon(0);spawnBalloon(0);
  balloonTimer=setInterval(()=>{
    const area=document.getElementById('balloons');
    if(!area)return clearBalloonTimer();
    if(area.children.length<6)spawnBalloon(0);
  },1400);
}

function spawnBalloon(delay=0){
  const area=document.getElementById('balloons');if(!area)return;
  const b=document.createElement('div');b.className='balloon';
  const c=COLORS[Math.floor(Math.random()*COLORS.length)];
  const size=55+Math.random()*30;
  const dur=9+Math.random()*4;
  const left=5+Math.random()*85;
  b.style.cssText=`background:${c};color:${c};width:${size}px;height:${size*1.25}px;left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s`;
  b.onclick=ev=>{ev.stopPropagation();popBalloon(b)};
  area.appendChild(b);
  setTimeout(()=>{if(b.parentNode)b.remove()},(dur+Math.max(0,delay))*1000+200);
}

function popBalloon(el){
  if(!session.user)return;
  if(!gameStarted()){el.remove();return}
  const players=loadPlayers();const p=players[session.user];const t=todayStr();
  if(Date.now()<(p.next_play_at||0)){el.remove();return}
  const roll=weightedRoll();if(!roll){el.remove();return}
  const value=roll.value;
  // streak: increment when last play was the previous day, reset if >1 day gap
  if(p.last_play_date){
    const d=diffDays(p.last_play_date,t);
    if(d===1)p.streak=(p.streak||0)+1;
    else if(d>1)p.streak=1;
  }else p.streak=1;
  let mult=1;if(p.streak>=7)mult=1.5;else if(p.streak>=3)mult=1.2;
  const earned=Math.round(value*mult);
  p.total_vc+=earned;p.last_play_date=t;
  p.next_play_at=Date.now()+COOLDOWN_MS;
  p.pops_today=1;p.today_values=[value];
  const entry={date:t,time:nowTime(),vc:earned};
  p.history=p.history||[];p.history.unshift(entry);p.history=p.history.slice(0,200);
  savePlayers(players);
  const log=loadLog();log.unshift({player:session.user,...entry});saveLog(log);
  // FX
  const rect=el.getBoundingClientRect();const game=document.getElementById('gameArea').getBoundingClientRect();
  const x=rect.left-game.left+rect.width/2,y=rect.top-game.top+rect.height/2;
  popSound();
  for(let i=0;i<14;i++){
    const pt=document.createElement('div');pt.className='pop-particle';
    const c=COLORS[Math.floor(Math.random()*COLORS.length)];
    const ang=Math.random()*Math.PI*2,dist=40+Math.random()*60;
    pt.style.cssText=`left:${x}px;top:${y}px;background:${c};--tx:${Math.cos(ang)*dist}px;--ty:${Math.sin(ang)*dist}px;box-shadow:0 0 8px ${c}`;
    document.getElementById('gameArea').appendChild(pt);
    setTimeout(()=>pt.remove(),750);
  }
  const fl=document.createElement('div');fl.className='float-vc';
  fl.textContent=`+${earned} VC`;
  fl.style.cssText=`left:${x-30}px;top:${y-20}px`;
  document.getElementById('gameArea').appendChild(fl);setTimeout(()=>fl.remove(),1700);
  el.remove();
  renderLog();renderRanking();renderLoginArea();renderGameArea();
}

let _cdTimer=null;
function startCountdownTo(targetMs,longFmt){
  if(_cdTimer)clearInterval(_cdTimer);
  const upd=()=>{
    const el=document.getElementById('cd');if(!el){clearInterval(_cdTimer);_cdTimer=null;return}
    const left=targetMs-Date.now();
    el.textContent=longFmt?fmtDHMS(left):fmtHMS(left);
    const nx=document.getElementById('nextIn');if(nx)nx.textContent=left>0?fmtHMS(left):'PRONTO';
    if(left<=0){clearInterval(_cdTimer);_cdTimer=null;renderGameArea();}
  };
  upd();_cdTimer=setInterval(upd,1000);
}

/* ============ ADMIN ============ */
function renderAdminGate(){
  root.innerHTML=`<div class="login-admin"><div class="card"><h2>🔒 ADMIN · Estoura Balão</h2>
    <input class="input" id="apw" type="password" placeholder="Senha admin"/>
    <button class="btn red" id="abtn">ENTRAR</button></div></div>`;
  document.getElementById('abtn').onclick=()=>{
    if(document.getElementById('apw').value==='vibeadmin2025')renderAdmin();
    else alert('Senha incorreta');
  };
  document.getElementById('apw').onkeydown=e=>{if(e.key==='Enter')document.getElementById('abtn').click()};
}

function renderAdmin(){
  const players=loadPlayers();const log=loadLog();const t=todayStr();
  const names=Object.keys(players);
  const totalVc=names.reduce((s,n)=>s+players[n].total_vc,0);
  const avg=names.length?Math.round(totalVc/names.length):0;
  const popsToday=log.filter(e=>e.date===t).length;
  root.innerHTML=`<div class="admin">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h1>🔧 Painel Estoura Balão</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" style="width:auto" onclick="location.href='/estourabalaao.html'">← Voltar ao Jogo</button>
        <button class="btn" style="width:auto" id="csvBtn">⬇ Export CSV</button>
        <button class="btn red" style="width:auto" id="resetGameBtn">🧨 RESET GERAL</button>
      </div>
    </div>
    <div class="grid-stats">
      <div class="stat-card"><div class="label">Jogadores</div><div class="value">${names.length}</div></div>
      <div class="stat-card"><div class="label">VC distribuídos</div><div class="value">${totalVc}</div></div>
      <div class="stat-card"><div class="label">Média VC/jogador</div><div class="value">${avg}</div></div>
      <div class="stat-card"><div class="label">Balões hoje</div><div class="value">${popsToday}</div></div>
    </div>
    <section><h2>🏆 Ranking Geral</h2>
      <div class="card"><table><thead><tr><th>#</th><th>Nome</th><th>VibeCoins</th><th>Streak</th><th>Último acesso</th></tr></thead>
      <tbody>${names.sort((a,b)=>players[b].total_vc-players[a].total_vc).map((n,i)=>`
        <tr><td>${i+1}</td><td>${n}</td><td><b style="color:var(--yellow)">${players[n].total_vc}</b></td><td>🔥${players[n].streak||0}</td><td>${players[n].last_play_date||'-'}</td></tr>`).join('')||'<tr><td colspan=5 style="text-align:center;color:var(--muted)">Sem jogadores</td></tr>'}</tbody></table></div>
    </section>
    <section><h2>👥 Gerenciar Jogadores</h2>
      <div class="card"><table><thead><tr><th>Nome</th><th>VC</th><th>Streak</th><th>Ações</th></tr></thead>
      <tbody id="pmTbody"></tbody></table></div>
    </section>
    <section><h2>📜 Log Completo</h2>
      <div class="toolbar"><input id="logFilter" placeholder="Filtrar por nome..."/><button id="logClear">Limpar Log</button></div>
      <div class="card" style="max-height:340px;overflow:auto"><table><thead><tr><th>Jogador</th><th>Data</th><th>Hora</th><th>VC</th></tr></thead>
      <tbody id="logTbody"></tbody></table></div>
    </section>
  </div>`;
  document.getElementById('csvBtn').onclick=exportCsv;
  document.getElementById('logFilter').oninput=renderLogTable;
  document.getElementById('logClear').onclick=()=>{if(confirm('Limpar todo o log global?')){saveLog([]);renderAdmin()}};
  document.getElementById('resetGameBtn').onclick=()=>{
    if(!confirm('RESET GERAL: apagar TODOS os jogadores e logs?'))return;
    savePlayers({});saveLog([]);renderAdmin();
  };
  renderPlayerMgmt();renderLogTable();
}

function renderPlayerMgmt(){
  const players=loadPlayers();const tb=document.getElementById('pmTbody');
  const names=Object.keys(players);
  tb.innerHTML=names.map(n=>`<tr>
    <td>${n}</td><td><b style="color:var(--yellow)">${players[n].total_vc}</b></td><td>🔥${players[n].streak||0}</td>
    <td><div class="row-btns">
      <button onclick="adminResetPlayer('${n.replace(/'/g,"\\'")}')">Resetar Pontos</button>
      <button onclick="adminClearCooldown('${n.replace(/'/g,"\\'")}')">Liberar Cooldown</button>
      <button onclick="adminEditBalance('${n.replace(/'/g,"\\'")}')">Editar Saldo</button>
      <button class="danger" onclick="adminDeletePlayer('${n.replace(/'/g,"\\'")}')">Excluir</button>
    </div></td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center;color:var(--muted)">Sem jogadores</td></tr>';
}

function renderLogTable(){
  const f=(document.getElementById('logFilter')?.value||'').toLowerCase();
  const log=loadLog().filter(e=>e.player.toLowerCase().includes(f));
  document.getElementById('logTbody').innerHTML=log.map(e=>`<tr><td>${e.player}</td><td>${e.date}</td><td>${e.time}</td><td><b style="color:var(--yellow)">+${e.vc}</b></td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center;color:var(--muted)">Vazio</td></tr>';
}

window.adminResetPlayer=function(n){if(!confirm('Resetar pontos de '+n+'?'))return;const p=loadPlayers();p[n].total_vc=0;p[n].streak=0;p[n].pops_today=0;p[n].today_values=[];p[n].history=[];p[n].next_play_at=0;p[n].last_play_date=null;savePlayers(p);renderAdmin()};
window.adminClearCooldown=function(n){const p=loadPlayers();p[n].next_play_at=0;savePlayers(p);renderAdmin()};
window.adminDeletePlayer=function(n){if(!confirm('Excluir '+n+' permanentemente?'))return;const p=loadPlayers();delete p[n];savePlayers(p);renderAdmin()};
window.adminEditBalance=function(n){const v=prompt('Novo saldo VC para '+n+':',loadPlayers()[n].total_vc);if(v===null)return;const num=parseInt(v);if(isNaN(num))return alert('Inválido');const p=loadPlayers();p[n].total_vc=num;savePlayers(p);renderAdmin()};

function exportCsv(){
  const p=loadPlayers();
  let csv='Nome,VibeCoins,Streak,Ultimo Acesso,Pops Hoje\n';
  Object.keys(p).forEach(n=>{const x=p[n];csv+=`"${n}",${x.total_vc},${x.streak||0},${x.last_play_date||''},${x.pops_today||0}\n`});
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='estourabalaao_jogadores.csv';a.click();URL.revokeObjectURL(url);
}

/* ============ CROSS-TAB REALTIME SYNC ============ */
let _syncTimer=null;
function scheduleSync(){
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{
    try{
      if(isAdmin){
        if(document.querySelector('.admin')){renderPlayerMgmt();renderLogTable();}
      }else{
        if(document.getElementById('rankList'))renderRanking();
        if(document.getElementById('logList'))renderLog();
        if(session.user){renderStreak();}
      }
    }catch(e){console.warn('sync err',e)}
  },120);
}
window.addEventListener('storage',(e)=>{
  if(e.key===LS_PLAYERS||e.key===LS_LOG)scheduleSync();
});
// fallback poll (covers same-tab edits made by admin actions inside iframe)
let _lastSig='';
setInterval(()=>{
  try{
    const sig=(localStorage.getItem(LS_PLAYERS)||'').length+'|'+(localStorage.getItem(LS_LOG)||'').length+'|'+((localStorage.getItem(LS_PLAYERS)||'').slice(-40));
    if(sig!==_lastSig){_lastSig=sig;scheduleSync();}
  }catch(e){}
},1500);
</script>
